{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Сервис учёта посылок{% endblock %}</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
<img src="{% static 'homepage/img/logo.png' %}"
     alt="DeliveryService" class="site-logo">

{% include "includes/navigation.html" %}

<main class="container pb-5">
    {% block content %}{% endblock %}
</main>

<footer class="container mt-4 mb-3">
    <p>&copy; <span id="current-year"></span> DeliveryService</p>
</footer>

<script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
